name: Build and Test .NET 10 on Windows
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore BMWExxtraction.sln
      - name: Build
        run: dotnet build BMWExxtraction.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test BMWExxtraction.sln --no-build --configuration Release
